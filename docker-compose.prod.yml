services:
  devops-backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: devops-backend-prod
    ports:
      - "8004:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=api.nextgensis.mooazsayyed.live,localhost,127.0.0.1,3.231.187.192
      - CORS_ALLOWED_ORIGINS=https://nextgensis.mooazsayyed.live,http://3.231.187.192
      - ENVIRONMENT=production
      - SECRET_KEY=django-production-secret-key-xyz123
    volumes:
      - devops_backend_static_prod:/app/staticfiles
    networks:
      - devops-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped

  devops-frontend-prod:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: devops-frontend-prod
    ports:
      - "5177:5173"
    environment:
      - VITE_API_URL=${PROD_VITE_API_URL}
    depends_on:
      - devops-backend-prod
    networks:
      - devops-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped

volumes:
  devops_backend_static_prod:
    name: devops_backend_static_prod

networks:
  devops-prod-network:
    name: devops-prod-network
    driver: bridge