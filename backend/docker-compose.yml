version: '3.8'

services:
  # Base/Development
  django-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=config.settings
    profiles:
      - dev

  # Production
  django-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=config.settings_prod
    profiles:
      - prod

  # Distroless
  django-distroless:
    build:
      context: .
      dockerfile: Dockerfile.distroless
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
    profiles:
      - distroless

  # Base test
  django-base:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
    profiles:
      - base