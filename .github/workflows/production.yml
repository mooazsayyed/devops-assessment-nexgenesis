name: Production Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: [self-hosted, production]

    env:
      BACKEND_IMAGE: mooaz/devops-backend
      FRONTEND_IMAGE: mooaz/devops-frontend
      IMAGE_TAG: prod-sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Clean Docker builder cache and old images
        run: |
          # Clean builder cache
          docker builder prune -af
          # Remove old images to force fresh build
          docker rmi $BACKEND_IMAGE:production 2>/dev/null || true
          docker rmi $FRONTEND_IMAGE:production 2>/dev/null || true
          docker image prune -af

      - name: Build backend image
        run: |
          docker build --no-cache --pull \
                 -t $BACKEND_IMAGE:production \
                 -t $BACKEND_IMAGE:$IMAGE_TAG ./backend

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:production
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      - name: Build frontend image
        run: |
          docker build --no-cache --pull \
            --build-arg VITE_API_URL=${{ secrets.PROD_VITE_API_URL }} \
            -t $FRONTEND_IMAGE:production \
            -t $FRONTEND_IMAGE:$IMAGE_TAG ./frontend

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:production
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, production]

    env:
      BACKEND_IMAGE: mooaz/devops-backend
      FRONTEND_IMAGE: mooaz/devops-frontend
      IMAGE_TAG: prod-sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/ec2-key-prod.pem
          chmod 600 ~/.ssh/ec2-key-prod.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Stop existing containers
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} "
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            # Stop and remove containers using compose
            if [ -f docker-compose.prod.yml ]; then
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
            fi
            # Force remove any remaining containers
            docker rm -f devops-backend-prod devops-frontend-prod 2>/dev/null || true
            # Clean up any dangling containers
            docker container prune -f || true
          "

      - name: Create .env.prod
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} << EOF
          cd /home/ubuntu/app
          cat > .env.prod << EOT
          PROD_DEBUG=${{ secrets.PROD_DEBUG }}
          PROD_ALLOWED_HOSTS=${{ secrets.PROD_ALLOWED_HOSTS }}
          PROD_CORS_ALLOWED_ORIGINS=${{ secrets.PROD_CORS_ALLOWED_ORIGINS }}
          PROD_SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
          PROD_VITE_API_URL=${{ secrets.PROD_VITE_API_URL }}
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          EOT
          EOF

      - name: Copy docker compose file
        run: |
          scp -i ~/.ssh/ec2-key-prod.pem \
            docker-compose.prod.yml \
            ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }}:/home/ubuntu/app/

      - name: Clean old images and pull fresh
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} "
            cd /home/ubuntu/app
            echo 'Removing all devops images...'
            # Remove ALL devops images (including old SHAs)
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep 'devops-backend\|devops-frontend' | awk '{print \$2}' | xargs -r docker rmi -f 2>/dev/null || true
            # Clean up everything
            docker image prune -af
            docker container prune -f
            echo 'Pulling fresh images...'
            # Pull fresh images
            docker pull ${BACKEND_IMAGE}:${IMAGE_TAG}
            docker pull ${FRONTEND_IMAGE}:${IMAGE_TAG}
            echo 'Images pulled successfully'
          "

      - name: Deploy with force recreate
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} "
            cd /home/ubuntu/app
            # Start services with force recreate
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate
            # Wait for containers to start
            echo 'Waiting for containers to start...'
            sleep 15
            # Show container status
            docker compose -f docker-compose.prod.yml ps
            echo ''
            echo '=== Backend Logs ==='
            docker logs devops-backend-prod --tail 30 || true
            echo ''
            echo '=== Frontend Logs ==='
            docker logs devops-frontend-prod --tail 30 || true
          "

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} "
            cd /home/ubuntu/app
            echo 'Checking container health...'
            
            # Check backend
            BACKEND_STATUS=\$(docker inspect -f '{{.State.Status}}' devops-backend-prod 2>/dev/null || echo 'not_found')
            if [ \"\$BACKEND_STATUS\" = \"running\" ]; then
              echo '✅ Backend is running'
            else
              echo '❌ Backend is not running (status: '\$BACKEND_STATUS')'
              docker logs devops-backend-prod --tail 50 2>/dev/null || true
              exit 1
            fi
            
            # Check frontend
            FRONTEND_STATUS=\$(docker inspect -f '{{.State.Status}}' devops-frontend-prod 2>/dev/null || echo 'not_found')
            if [ \"\$FRONTEND_STATUS\" = \"running\" ]; then
              echo '✅ Frontend is running'
            else
              echo '❌ Frontend is not running (status: '\$FRONTEND_STATUS')'
              docker logs devops-frontend-prod --tail 50
              exit 1
            fi
            
            echo ''
            echo '=== Deployment Successful ==='
            docker ps --filter name=devops
          "

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2-key-prod.pem
