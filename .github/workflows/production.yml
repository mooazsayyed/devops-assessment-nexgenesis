name: Production Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: [self-hosted, production]

    env:
      BACKEND_IMAGE: mooaz/devops-backend
      FRONTEND_IMAGE: mooaz/devops-frontend
      IMAGE_TAG: prod-sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build backend image
        run: |
          docker build -t $BACKEND_IMAGE:production \
                       -t $BACKEND_IMAGE:$IMAGE_TAG ./backend

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:production
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      - name: Build frontend image
        run: |
          docker build -t $FRONTEND_IMAGE:production \
                       -t $FRONTEND_IMAGE:$IMAGE_TAG ./frontend

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:production
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, production]

    env:
      BACKEND_IMAGE: mooaz/devops-backend
      FRONTEND_IMAGE: mooaz/devops-frontend
      IMAGE_TAG: prod-sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/ec2-key-prod.pem
          chmod 600 ~/.ssh/ec2-key-prod.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST_PROD }} >> ~/.ssh/known_hosts

      - name: Stop existing containers
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem \
              ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} << 'EOF'
          set -e
          mkdir -p /home/ubuntu/app
          cd /home/ubuntu/app

          if [ -f docker-compose.prod.yml ]; then
            docker compose -f docker-compose.prod.yml down || true
          fi

          docker rm -f devops-backend-prod devops-frontend-prod 2>/dev/null || true
          EOF

      - name: Create .env.prod
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} "
            cd /home/ubuntu/app
            echo 'PROD_DEBUG=${{ secrets.PROD_DEBUG }}' > .env.prod
            echo 'PROD_ALLOWED_HOSTS=${{ secrets.PROD_ALLOWED_HOSTS }}' >> .env.prod
            echo 'PROD_CORS_ALLOWED_ORIGINS=${{ secrets.PROD_CORS_ALLOWED_ORIGINS }}' >> .env.prod
            echo 'PROD_SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}' >> .env.prod
            echo 'PROD_VITE_API_URL=${{ secrets.PROD_VITE_API_URL }}' >> .env.prod
            echo 'BACKEND_IMAGE=${BACKEND_IMAGE}' >> .env.prod
            echo 'FRONTEND_IMAGE=${FRONTEND_IMAGE}' >> .env.prod
            echo 'IMAGE_TAG=${IMAGE_TAG}' >> .env.prod
          "

      - name: Copy docker-compose file
        run: |
          scp -i ~/.ssh/ec2-key-prod.pem \
            docker-compose.prod.yml \
            ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }}:/home/ubuntu/app/

      - name: Pull images & deploy
        run: |
          ssh -i ~/.ssh/ec2-key-prod.pem \
              ${{ secrets.EC2_USER_PROD }}@${{ secrets.EC2_HOST_PROD }} << EOF
          set -e
          cd /home/ubuntu/app
          docker pull ${BACKEND_IMAGE}:${IMAGE_TAG}
          docker pull ${FRONTEND_IMAGE}:${IMAGE_TAG}
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
          docker compose -f docker-compose.prod.yml ps
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2-key-prod.pem
