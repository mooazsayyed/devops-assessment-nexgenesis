name: Pre-Prod Build & Push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional custom tag (leave empty to use commit SHA)"
        required: false

  push:
    branches:
      - pre-prod

jobs:
  build-and-push:
    runs-on: [self-hosted, preprod]

    env:
      BACKEND_IMAGE: mooaz/devops-backend
      FRONTEND_IMAGE: mooaz/devops-frontend
      IMAGE_TAG: preprod-sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # -------- BACKEND --------
      - name: Build backend image
        run: |
          docker build \
            -t $BACKEND_IMAGE:preprod \
            -t $BACKEND_IMAGE:${IMAGE_TAG} \
            ./backend

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:preprod
          docker push $BACKEND_IMAGE:${IMAGE_TAG}

      # -------- FRONTEND --------
      - name: Build frontend image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:preprod \
            -t $FRONTEND_IMAGE:${IMAGE_TAG} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:preprod
          docker push $FRONTEND_IMAGE:${IMAGE_TAG}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, preprod]

    env:
      BACKEND_IMAGE: mooaz/devops-backend
      FRONTEND_IMAGE: mooaz/devops-frontend
      IMAGE_TAG: preprod-sha-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2-key.pem
          sed -i 's/\r$//' ~/.ssh/ec2-key.pem 2>/dev/null || true
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Install Docker Compose on EC2
        run: |
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            docker compose version
          "

      - name: Clean Existing Deployment
        run: |
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            if [ -f docker-compose.preprod.yml ]; then
              docker compose -f docker-compose.preprod.yml down
            fi
            docker rm devops-backend-preprod devops-frontend-preprod 2>/dev/null || true
          "

      - name: Create Environment File
        run: |
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cat > /home/ubuntu/app/.env.preprod << 'EOF'
          DEBUG=${{ secrets.PREPROD_DEBUG }}
          ALLOWED_HOSTS=${{ secrets.PREPROD_ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.PREPROD_CORS_ALLOWED_ORIGINS }}
          SECRET_KEY=${{ secrets.PREPROD_SECRET_KEY }}
          VITE_API_URL=${{ secrets.PREPROD_VITE_API_URL }}
          BACKEND_IMAGE=${BACKEND_IMAGE}
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          IMAGE_TAG=${IMAGE_TAG}
          EOF
          "

      - name: Copy Docker Compose File
        run: |
          scp -i ~/.ssh/ec2-key.pem docker-compose.preprod.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/

      - name: Pull Images
        run: |
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/app
            docker pull ${BACKEND_IMAGE}:${IMAGE_TAG}
            docker pull ${FRONTEND_IMAGE}:${IMAGE_TAG}
          "

      - name: Deploy Containers
        run: |
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/app
            docker compose -f docker-compose.preprod.yml --env-file .env.preprod up -d
          "

      - name: Verify Deployment
        run: |
          sleep 30
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd /home/ubuntu/app
            docker compose -f docker-compose.preprod.yml ps
            docker ps | grep preprod
          "

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/ec2-key.pem
