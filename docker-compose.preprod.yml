services:
  devops-backend-preprod:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: devops-backend-preprod
    ports:
      - "8003:8000"
    environment:
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - devops_backend_static_preprod:/app/staticfiles
    networks:
      - devops-preprod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped

  devops-frontend-preprod:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: devops-frontend-preprod
    ports:
      - "5176:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - devops-backend-preprod
    networks:
      - devops-preprod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped

volumes:
  devops_backend_static_preprod:
    name: devops_backend_static_preprod

networks:
  devops-preprod-network:
    name: devops-preprod-network
    driver: bridge