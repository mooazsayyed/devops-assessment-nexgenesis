version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - devops-prod-network
      - devops-preprod-network
    restart: unless-stopped
    depends_on:
      - devops-backend-prod
      - devops-frontend-prod
      - devops-backend-preprod
      - devops-frontend-preprod

networks:
  devops-prod-network:
    external: true
    name: devops-prod-network
  devops-preprod-network:
    external: true
    name: devops-preprod-network